<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242832"/>
      <stop offset="100%" stop-color="#15171C"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84F0DE"/>
      <stop offset="100%" stop-color="#45C4B0"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84F0DE"/>
      <stop offset="100%" stop-color="#45C4B0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#45C4B0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with accent border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#45C4B0" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Glowing Elements -->
  <g filter="url(#glow)">
    <!-- Dynamic Clean Sparkle -->
    <path d="M42 12 C42 19.5 47.5 24 53 25 C47.5 26 42 30.5 42 38 C42 30.5 36.5 26 31 25 C36.5 24 42 19.5 42 12 Z" fill="url(#sparkleGrad)" />
    
    <!-- Mini sparkle -->
    <path d="M19 14 C19 17.5 21.5 19.5 24 20 C21.5 20.5 19 22.5 19 26 C19 22.5 16.5 20.5 14 20 C16.5 19.5 19 17.5 19 14 Z" fill="#84F0DE" opacity="0.85"/>
    
    <!-- CleanCheck Signature Checkmark -->
    <path d="M15 37 L26 48 L49 23" stroke="url(#checkGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
